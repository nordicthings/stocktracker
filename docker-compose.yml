services:
  stocktrackerdb:
    image: mariadb:12
    environment:
      MARIADB_DATABASE: stocktracker
      MARIADB_USER: stocktracker
      MARIADB_PASSWORD: stocktracker
      MARIADB_ROOT_PASSWORD: stocktracker-root
    volumes:
      - stocktracker-mariadb-data:/var/lib/mysql
    networks:
      - stocktracker-app
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      stocktrackerdb:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: mariadb
      DB_HOST: stocktrackerdb
      DB_PORT: 3306
      DB_NAME: stocktracker
      DB_USERNAME: stocktracker
      DB_PASSWORD: stocktracker
    ports:
      - "8080:8080"
    networks:
      - stocktracker-app

volumes:
  stocktracker-mariadb-data:
    name: stocktracker-mariadb-data

networks:
  stocktracker-app:
    name: stocktracker-app
    driver: bridge
