services:
  stocktrackerdb:
    image: mariadb:12
    environment:
      MARIADB_DATABASE: stocktracker
      MARIADB_USER: stocktracker
      MARIADB_PASSWORD: stocktracker
      MARIADB_ROOT_PASSWORD: stocktracker-root
    volumes:
      - stocktracker-mariadb-data:/var/lib/mysql
    networks:
      - stocktracker-app
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      stocktrackerdb:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: mariadb
      DB_HOST: stocktrackerdb
      DB_PORT: 3306
      DB_NAME: stocktracker
      DB_USERNAME: stocktracker
      DB_PASSWORD: stocktracker
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      SMTP_STARTTLS_ENABLED: ${SMTP_STARTTLS_ENABLED:-true}
      SHOPPING_LIST_EMAIL_FROM: ${SHOPPING_LIST_EMAIL_FROM:-}
      SHOPPING_LIST_EMAIL_RECIPIENTS: ${SHOPPING_LIST_EMAIL_RECIPIENTS:-}
      SHOPPING_LIST_EMAIL_CONDITION: ${SHOPPING_LIST_EMAIL_CONDITION:-CHANGED_ITEMS_BELOW_TARGET_STOCK}
      SHOPPING_LIST_EMAIL_SCHEDULE: ${SHOPPING_LIST_EMAIL_SCHEDULE:--}
    ports:
      - "8080:8080"
    networks:
      - stocktracker-app

volumes:
  stocktracker-mariadb-data:
    name: stocktracker-mariadb-data

networks:
  stocktracker-app:
    name: stocktracker-app
    driver: bridge
