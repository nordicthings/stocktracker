services:
  stocktracker:
    image: ${APP_IMAGE:-stocktracker:0.1.0}
    container_name: stocktracker
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: mariadb
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      SMTP_STARTTLS_ENABLED: ${SMTP_STARTTLS_ENABLED:-true}
      SHOPPING_LIST_EMAIL_FROM: ${SHOPPING_LIST_EMAIL_FROM:-}
      SHOPPING_LIST_EMAIL_RECIPIENTS: ${SHOPPING_LIST_EMAIL_RECIPIENTS:-}
      SHOPPING_LIST_EMAIL_CONDITION: ${SHOPPING_LIST_EMAIL_CONDITION:-CHANGED_ITEMS_BELOW_TARGET_STOCK}
      SHOPPING_LIST_EMAIL_SCHEDULE: ${SHOPPING_LIST_EMAIL_SCHEDULE:--}
    ports:
      - "${APP_PORT:-8080}:8080"
    networks:
      stocktracker-app:
        ipv4_address: ${APP_IPV4:-172.31.10.10}

networks:
  stocktracker-app:
    name: stocktracker-app
    driver: bridge
    ipam:
      config:
        - subnet: ${APP_SUBNET:-172.31.10.0/24}
