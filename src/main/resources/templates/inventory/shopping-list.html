<!doctype html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Einkaufsliste</title>
    <link rel="icon" type="image/png" th:href="@{/favicon.png}">
    <link rel="apple-touch-icon" th:href="@{/apple-touch-icon.png}">
    <link rel="stylesheet" th:href="@{/css/inventory.css}">
    <script defer th:src="@{/webjars/htmx.org/dist/htmx.min.js}"></script>
</head>
<body class="inventory-page" hx-boost="true">
<main class="page-shell">
    <header class="page-header">
        <div><p class="eyebrow">Nordic Things</p><h1>Einkaufsliste</h1></div>
        <a class="secondary-action" th:href="@{/items}">Zurück zur Bestandsliste</a>
    </header>

    <section class="message success" th:if="${successMessage}" th:text="${successMessage}"></section>
    <section class="message error" th:if="${errorMessage}" th:text="${errorMessage}"></section>

    <section class="workspace" id="shopping-workspace">
        <div class="shopping-list-actions">
            <form method="post" th:action="@{/shopping-list/email}"><button type="submit">Per E-Mail versenden</button></form>
            <form method="post" th:action="@{/shopping-list/fill-to-target}" onsubmit="return confirm('Alle Einkaufslistenpositionen auf Sollbestand setzen?');"><button type="submit">Alles auf Sollbestand</button></form>
        </div>

        <div class="inventory-table-wrap">
            <table class="inventory-table shopping-list-table">
                <thead><tr><th scope="col"><a th:href="@{/shopping-list(shoppingSort=${nextNameSort})}">Artikel</a></th><th scope="col"><a th:href="@{/shopping-list(shoppingSort=${nextCategorySort})}">Kategorie</a></th><th scope="col">Einkaufsmenge</th><th scope="col" aria-label="Aktionen"></th></tr></thead>
                <tbody>
                <tr th:each="item : ${shoppingList}">
                    <td th:text="${item.itemName}">Reis</td>
                    <td th:text="${item.categoryName}">Konserven</td><td th:text="${item.recommendedPurchaseQuantity}">2</td>
                    <td><div class="table-actions"><form method="post" th:action="@{/items/{itemId}/stock/fill-to-target(itemId=${item.itemId})}"><input type="hidden" name="returnTo" value="shopping-list"><button type="submit">Auf Sollbestand</button></form></div></td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
